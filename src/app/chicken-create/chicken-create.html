<div class="chicken-details container">
  <div class="text-details">
    <form [formGroup]="newChickenForm">
      <label for="name">Name : </label>
      <input id="name" class="form-control" formControlName="name" type="text" required>

      <label for="breed" class="d-inline">Breed : </label>
      <input id="breed" class="form-control" formControlName="breed" type="text" required>

      <label for="color">Color : </label>
      <input id="color" class="form-control" formControlName="color" type="text" required>

      <label for="weight">Weight : </label>
      <input id="weight" class="form-control" formControlName="weight" type="number" required>

      <label for="image">Upload Image : </label>
      <input id="image" class="form-control" formControlName="imageUrl" type="file" (change)="onFileSelected($event)">
    </form>

    <div class="text-center mt-3">
      <button class="btn btn-primary" (click)="createChicken()">Create</button>
    </div>
  </div>
</div>
